<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SageWrite 登录</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1e8;
        --panel: #fffaf2;
        --text: #1c2b20;
        --muted: #657568;
        --accent: #087653;
        --border: #ded8cd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(460px, calc(100vw - 32px));
        padding: 34px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 20px 60px rgba(25, 36, 28, 0.12);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      label {
        display: grid;
        gap: 10px;
        color: var(--muted);
        font-size: 18px;
      }

      input {
        width: 100%;
        min-height: 58px;
        padding: 0 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      button {
        width: 100%;
        min-height: 58px;
        margin-top: 18px;
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .status {
        min-height: 26px;
        margin-top: 16px;
        color: #9a3d2e;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">SageWrite</p>
      <h1>登录控制台</h1>
      <p id="login-hint">输入云端工作台管理员密码。</p>
      <form id="login-form">
        <label id="username-field" hidden>
          用户名
          <input id="username" name="username" type="text" autocomplete="username">
        </label>
        <label id="password-field">
          密码
          <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
        </label>
        <button type="submit">登录</button>
      </form>
      <div id="status" class="status"></div>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const status = document.querySelector("#status");
      const loginHint = document.querySelector("#login-hint");
      const usernameField = document.querySelector("#username-field");
      const usernameInput = document.querySelector("#username");
      const passwordInput = document.querySelector("#password");
      let authMode = "password";

      async function checkStatus() {
        const response = await fetch("/api/auth/status", { cache: "no-store" });
        const data = await response.json();
        if (!data.authEnabled || data.authenticated) {
          window.location.href = "/";
          return;
        }
        authMode = data.authMode || "password";
        if (authMode === "users") {
          usernameField.hidden = false;
          loginHint.textContent = "输入你的 SageWrite 用户名和密码。";
          usernameInput.focus();
        } else {
          usernameField.hidden = true;
          loginHint.textContent = "输入云端工作台管理员密码。";
          passwordInput.focus();
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "";
        const password = passwordInput.value;
        const payload = authMode === "users"
          ? { username: usernameInput.value, password }
          : { password };
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          status.textContent = data.error || "登录失败。";
          return;
        }
        window.location.href = "/";
      });

      checkStatus().catch(() => {
        status.textContent = "无法读取登录状态。";
      });
    </script>
  </body>
</html>
